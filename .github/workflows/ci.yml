name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System tools (OCR check and workbook recalculation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils libreoffice-calc
          tesseract --version | head -1
          soffice --version

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Rebuild everything from data/raw
        run: make all

      - name: Generated text outputs match the committed versions
        run: git diff --exit-code -- README.md docs/findings.md docs/discrepancies.md docs/assumptions.md docs/method.md outputs/bridge_table.csv

      - name: Tests (no skips allowed)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -p no:cacheprovider | tee pytest.log
          if grep -qiE "[0-9]+ skipped" pytest.log; then echo "tests were skipped"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.14'
        with:
          name: outputs
          path: |
            outputs/
            docs/
